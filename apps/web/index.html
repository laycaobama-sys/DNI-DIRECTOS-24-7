<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Emite tus vídeos 24/7 a YouTube, Twitch o cualquier destino RTMP desde la nube. Sube, ordena, programa y transmite sin depender de tu ordenador." />
    <meta property="og:title" content="DNI Directos 24/7 — Tu canal siempre en directo" />
    <meta property="og:description" content="Streaming continuo desde la nube: playlists, multidestino y recuperación automática." />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DNI Directos 24/7 — Tu canal siempre en directo</title>
    <script>
      try { const t = localStorage.getItem('theme'); if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark'); } catch {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
